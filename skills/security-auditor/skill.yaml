format_version: "1.0"
version: "1.0.0"
title: Security Auditor
description: Repository security audit combining deterministic scanning with AI severity analysis.
license: MIT
maintainer: "ASL Team <team@agentskillslab.dev>"
compatibility:
  agents: [claude-code, codex, cursor, github-copilot, opencode, kilo]
  requires:
    - python: ">=3.10"
permissions:
  filesystem: local
  network: none
  downloads: false
  install_packages: false
  subprocess: safe
  max_runtime_seconds: 600
determinism: partial
tags: [security, audit, scanning]
